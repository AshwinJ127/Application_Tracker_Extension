<!DOCTYPE html>
<html>
<head>
    <title>Job Tracker</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 10px; width: 250px; }
      h3 { text-align: center; margin-top: 0; }
      input[type="text"], select {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        box-sizing: border-box; 
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      button {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        background: #007BFF; 
        color: white;
      }
      button:hover { background: #0056b3; }
      #statusMsg { text-align: center; font-weight: bold; height: 1em; margin-top: 10px; }
    </style>
</head>
<body>
    <h3>Job Tracker</h3>
    <input type="text" id="companyNameInput" placeholder="Company Name" autofocus>
    <select id="statusSelector">
        <option value="Applied" selected>Applied</option>
        <option value="Need to Apply">Need to Apply</option>
    </select>
    <textarea id="jdInput" placeholder="Paste Job Description here..." rows="4" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-family: Arial, sans-serif; resize: vertical;"></textarea>
    <div style="margin-bottom: 10px;">
      <label for="resumeInput" style="font-size: 12px; color: #666; display: block; margin-bottom: 4px;">Resume used:</label>
      <input type="file" id="resumeInput" style="font-size: 12px; width: 100%;">
    </div>
    <button id="submitBtn">Save Job</button>
    <p id="statusMsg"></p>
    <script src="popup.js"></script>
</body>
</html>
